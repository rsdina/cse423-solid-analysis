<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Owner Form')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<h2 th:text="${owner.id == null} ? 'New Owner' : 'Edit Owner'">Owner Form</h2>

<form th:object="${owner}" method="post">
    <p>
        <label>First Name:</label>
        <input type="text" th:field="*{firstName}"/>
        <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" style="color:red;"></span>
    </p>
    <p>
        <label>Last Name:</label>
        <input type="text" th:field="*{lastName}"/>
        <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" style="color:red;"></span>
    </p>
    <p>
        <label>Address:</label>
        <input type="text" th:field="*{address}"/>
        <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" style="color:red;"></span>
    </p>
    <p>
        <label>City:</label>
        <input type="text" th:field="*{city}"/>
        <span th:if="${#fields.hasErrors('city')}" th:errors="*{city}" style="color:red;"></span>
    </p>
    <p>
        <label>Telephone:</label>
        <input type="text" th:field="*{telephone}"/>
        <span th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}" style="color:red;"></span>
    </p>
    <button type="submit">Save</button>
</form>
</body>
</html>
